services:
  - type: worker
    name: pharos-on-chain-alert-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run onchain-alert
    disk:
      name: pharos-alert-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_STATE_PATH
        value: /var/data/worker-state.json
